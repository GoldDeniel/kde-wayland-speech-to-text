[project]
name = "kde-stt"
version = "0.1.0"
description = "Global shortcut speech-to-text for Linux: press, speak, your words are typed."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "golddeniel" }]
dependencies = [
    "faster-whisper>=1.0",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "dbus-next>=0.2.3",
    "PySide6>=6.7",
]

[project.scripts]
kde-stt = "kde_stt.cli:main"
kde-sttd = "kde_stt.daemon:main"
kde-stt-frontend = "kde_stt.frontend.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kde_stt"]
